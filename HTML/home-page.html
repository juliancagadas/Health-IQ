<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health IQ Assessment Page</title>

    <link rel="stylesheet" href="../CSS/Home-Page/body-temperature.css">
    <link rel="stylesheet" href="../CSS/Home-Page/heart-rate.css">
    <link rel="stylesheet" href="../CSS/Home-Page/head-ache.css">
</head>
<body>
    <main>

      <header>
        <div class="vital-text-container">
          <img class="vital-sign-pic" src="">
          <p>Vital Signs</p>
        </div>

        <div class="vital-signs-container">

          <div class="body-temp-container">
            <div>
              <img class="body-temp-pic">
              <p>Body Temperature (°C)</p>
            </div>
            
            <div class="body-temperature-slider">
              <input
              class="body-slider"
              type="range"
              min="35"
              max="40"
              step="0.1"
              value="35">
              <div class="body-temperature-value">
                35 °C
              </div>
            </div>
          </div>


          <div class="heart-rate-container">
            <div>
              <img class="heart-rate-pic">
              <p>Heart Rate (BPM)</p>
            </div>
            
            <div class="heart-rate-slider">
              <input
              class="heart-slider"
              type="range"
              min="30"
              max="150"
              value="30">

              <div class="heart-rate-value">
                30 BPM
              </div>
            </div>
          </div>


          <div class="head-ache-container">
            <div>
              <img class="head-ache-pic">
              <p>Head Ache</p>
            </div>
            
            <div class="head-ache-slider">
              <input
              class="head-slider"
              type="range"
              min="0"
              max="10"
              step="0.1"
              value="0">

              <div class="head-ache-value">
                0
              </div>
            </div>
          </div>


          <div class="cough-container">
            <div>
              <img class="cough-pic">
              <p>Cough</p>
            </div>
            
            <div class="cough-slider">
              <input
              class="cough-slider"
              type="range"
              min="0"
              max="10"
              value="0">

              <div class="cough-value">
                0
              </div>
            </div>
          </div>


          <div class="fatigue-container">
            <div>
              <img class="fatigue-pic">
              <p>Fatigue</p>
            </div>
            
            <div class="fatigue-slider">
              <input
              class="fatigue-slider"
              type="range"
              min="0"
              max="10"
              value="0">

              <div class="fatigue-value">
                0
              </div>
            </div>
          </div>


          <div class="nausea-container">
            <div>
              <img class="nausea-pic">
              <p>Nausea</p>
            </div>
            
            <div class="nausea-slider">
              <input
              class="nausea-slider"
              type="range"
              min="0"
              max="10"
              value="0">

              <div class="nausea-value">
                0
              </div>
            </div>
          </div>


          <div class="sore-throat-container">
            <div>
              <img class="sore-throat-pic">
              <p>Sore Throat</p>
            </div>
            
            <div class="sore-throat-slider">
              <input
              class="sore-throat-slider"
              type="range"
              min="0"
              max="10"
              value="0">

              <div class="sore-throat-value">
                0
              </div>
            </div>
          </div>


          <div class="difficulty-breathing-container">
            <div>
              <img class="difficulty-breathing-pic">
              <p>Difficulty Breathing</p>
            </div>
            
            <div class="difficulty-breathing-slider">
              <input
              class="difficulty-breathing-slider"
              type="range"
              min="0"
              max="10"
              value="0">

              <div class="difficulty-breathing-value">
                0
              </div>
            </div>
          </div>







        </div>
      </header>

    </main>

    <script src="../JS/Home-Page/body-temperature.js"></script>
    <script src="../JS/Home-Page/heart-rate.js"></script>
    <script src="../JS/Home-Page/head-ache.js"></script>
    <script src="../JS/Home-Page/cough.js"></script>
    <script src="../JS/Home-Page/fatigue.js"></script>
    <script src="../JS/Home-Page/nausea.js"></script>
    <script src="../JS/Home-Page/sore-throat.js"></script>
    <script src="../JS/Home-Page/difficulty-breathing.js"></script>

</body>
</html>
