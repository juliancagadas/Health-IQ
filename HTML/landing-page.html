<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/Landing-Page/header.css">
    <title>Health IQ Landing Page</title>
</head>
<body>
    <main>

        <header>
            <div class="header-left-section">
                <img class="heart-icon" src="logo.png" alt="Health IQ Logo">
                <div class="two-paragraph">
                    <p class="health-paragraph">Health<span class="iq">IQ</span></p>
                    <p class="fuzzy-paragraph">Fuzzy Logic Health Assistant</p>
                </div>
            </div>
        
            <div class="header-right-section">
                <button class="home">Home</button>
                <button class="about">About</button>
                <button class="how-it-works">How It Works</button>
                <button class="disclaimer">Disclaimer</button>
            </div>

        </header>

        <section>
            <div class="mid-left-section">
                <p class="">Understand Your Health, <span class="smarter-paragraph">Smarter.</span></p>
                <p>HealthIQ uses Fuzzy Logic to assess your symtoms and via signs, providing personalized insights and recommendations to help you take better care of your well-being.</p>
                <button class="started-assistant"><img class="heart-icon">Start Health Assessment</button>
            </div>
            <div class="mid-right-section">
                <img class="health-assistant-image" src="../Assets/health-iq-pic.png" alt="Health Assistant Image">
            </div>
        </section>
    </main>

</body>
</html>
